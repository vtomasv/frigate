# =============================================================================
# Frigate NVR - Configuración para Apple Silicon (M3 Max)
# =============================================================================
# Documentación: https://docs.frigate.video/configuration/
#
# Esta configuración está optimizada para:
#   - Detector Apple Silicon vía ZMQ (contenedor o nativo)
#   - Ollama corriendo localmente en macOS (puerto 11434)
#   - Hardware: Apple M3 Max, 128 GB RAM
#   - 7 cámaras de prueba (6 videos locales + 1 webcam pública)
#
# Versión de Frigate: 0.17.0 (stable-standard-arm64)
# =============================================================================

mqtt:
  enabled: true
  host: mqtt
  port: 1883

# -----------------------------------------------------------------------------
# Detector: Apple Silicon vía ZMQ
# -----------------------------------------------------------------------------
# Modo Docker (por defecto): el detector corre en el contenedor "frigate-detector"
#   endpoint: tcp://frigate-detector:5555
#
# Modo Nativo (máximo rendimiento): cambiar a:
#   endpoint: tcp://host.docker.internal:5555
#   y ejecutar ./scripts/start-detector-native.sh
detectors:
  apple_silicon:
    type: zmq
    endpoint: tcp://frigate-detector:5555

# -----------------------------------------------------------------------------
# Modelo de detección de objetos
# -----------------------------------------------------------------------------
# YOLOv9-t optimizado: ~8ms en Neural Engine (nativo), ~25-40ms en CPU (Docker)
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# -----------------------------------------------------------------------------
# FFmpeg: sin aceleración de hardware dentro del contenedor Linux
# -----------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: []

# -----------------------------------------------------------------------------
# go2rtc: Restreaming de cámaras
# -----------------------------------------------------------------------------
# Todos los videos locales se reproducen en loop infinito usando ffmpeg exec.
# Documentación: https://github.com/AlexxIT/go2rtc
go2rtc:
  streams:
    # Video 1: Calle con personas, bicicletas y autos (768x432, 12fps)
    video_calle:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/test_video.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 2: Multitud de personas caminando (768x432, 12fps)
    video_personas:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/people-detection.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 3: Tráfico de autos en autopista (768x432, 12.5fps)
    video_autopista:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/car-detection.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 4: Personas pasando una por una - entrada/pasillo (768x432, 10fps)
    video_entrada:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/one-by-one-person-detection.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 5: Interior de tienda/retail - pasillo (720x404, 60fps)
    video_tienda:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/store-aisle-detection.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 6: Zona de trabajo exterior - trabajadores y vehículos (1920x1080, 60fps)
    video_obra:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /config/worker-zone-detection.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # Video 7: Webcam pública MJPEG (Japón) - puede no estar disponible 24/7
    webcam_publica:
      - "http://honjin1.miemasu.net/nphMotionJpeg?Resolution=640x480&Quality=Standard"

    # -------------------------------------------------------------------------
    # Ejemplo de cámara IP real (descomentar y ajustar)
    # -------------------------------------------------------------------------
    # camara_principal:
    #   - rtsp://usuario:password@192.168.1.100:554/stream1

# -----------------------------------------------------------------------------
# Generative AI - Ollama local en macOS
# -----------------------------------------------------------------------------
# Ollama debe estar corriendo en macOS con el modelo descargado:
#   ollama pull qwen3-vl:4b
#
# Modelos recomendados: qwen3-vl:4b, qwen2.5-vl, gemma3
genai:
  provider: ollama
  base_url: http://host.docker.internal:11434
  model: qwen3-vl:4b

# -----------------------------------------------------------------------------
# Cámaras
# -----------------------------------------------------------------------------
cameras:
  # ---------------------------------------------------------------------------
  # 1. Calle urbana: personas, bicicletas y autos
  # Escena: Calle con tráfico mixto (peatones, ciclistas, vehículos)
  # ---------------------------------------------------------------------------
  video_calle:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_calle
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 5
    objects:
      track:
        - person
        - bicycle
        - car
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 2. Multitud de personas caminando
  # Escena: Zona peatonal con múltiples personas en movimiento
  # ---------------------------------------------------------------------------
  video_personas:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_personas
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 5
    objects:
      track:
        - person
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 3. Autopista: tráfico de vehículos
  # Escena: Carretera con autos circulando
  # ---------------------------------------------------------------------------
  video_autopista:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_autopista
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 5
    objects:
      track:
        - car
        - truck
        - bus
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 4. Entrada/pasillo: personas pasando una por una
  # Escena: Punto de acceso con personas entrando secuencialmente
  # ---------------------------------------------------------------------------
  video_entrada:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_entrada
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 5
    objects:
      track:
        - person
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 5. Interior de tienda/retail
  # Escena: Pasillo de tienda con personas comprando
  # ---------------------------------------------------------------------------
  video_tienda:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_tienda
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 720
      height: 404
      fps: 5
    objects:
      track:
        - person
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 6. Zona de obra/trabajo exterior
  # Escena: Sitio de construcción con trabajadores y vehículos pesados
  # ---------------------------------------------------------------------------
  video_obra:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_obra
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5
    objects:
      track:
        - person
        - car
        - truck
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # ---------------------------------------------------------------------------
  # 7. Webcam pública MJPEG (Japón)
  # Stream en vivo. Puede tener latencia o no estar disponible 24/7.
  # ---------------------------------------------------------------------------
  webcam_publica:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/webcam_publica
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
        - car

  # -------------------------------------------------------------------------
  # Ejemplo de cámara IP real (descomentar y ajustar)
  # -------------------------------------------------------------------------
  # camara_principal:
  #   enabled: true
  #   ffmpeg:
  #     inputs:
  #       - path: rtsp://127.0.0.1:8554/camara_principal
  #         input_args: preset-rtsp-restream
  #         roles:
  #           - detect
  #           - record
  #   detect:
  #     enabled: true
  #     width: 640
  #     height: 480
  #     fps: 5
  #   objects:
  #     track:
  #       - person
  #       - car
  #       - dog
  #       - cat
  #     genai:
  #       enabled: true
  #   review:
  #     genai:
  #       enabled: true
  #   record:
  #     enabled: true

version: 0.17-0
