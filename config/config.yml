# =============================================================================
# Frigate NVR - Configuración para Apple Silicon (M3 Max)
# =============================================================================
# Documentación: https://docs.frigate.video/configuration/
#
# Esta configuración está optimizada para:
#   - Detector Apple Silicon vía ZMQ (contenedor o nativo)
#   - Ollama corriendo localmente en macOS (puerto 11434)
#   - Hardware: Apple M3 Max, 128 GB RAM
# =============================================================================

mqtt:
  enabled: true
  host: mqtt
  port: 1883

# -----------------------------------------------------------------------------
# Detector: Apple Silicon vía ZMQ
# -----------------------------------------------------------------------------
# Modo Docker:  el detector corre en el contenedor "frigate-detector"
# Modo Nativo:  cambiar endpoint a tcp://host.docker.internal:5555
#               y ejecutar ./scripts/start-detector-native.sh
detectors:
  apple_silicon:
    type: zmq
    endpoint: tcp://frigate-detector:5555

# -----------------------------------------------------------------------------
# Modelo de detección de objetos
# -----------------------------------------------------------------------------
# YOLOv9-t optimizado para Apple Silicon: ~8ms en Neural Engine (nativo)
# ~25-40ms en CPUExecutionProvider ARM64 (Docker)
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# -----------------------------------------------------------------------------
# FFmpeg: sin aceleración de hardware dentro del contenedor Linux
# -----------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: []

# -----------------------------------------------------------------------------
# go2rtc: Restreaming de cámaras
# -----------------------------------------------------------------------------
go2rtc:
  streams:
    # Ejemplo: descomentar y ajustar con los datos de tu cámara
    # camara_principal:
    #   - rtsp://usuario:password@192.168.1.100:554/stream1
    # camara_principal_sub:
    #   - rtsp://usuario:password@192.168.1.100:554/stream2
    dummy: []

# -----------------------------------------------------------------------------
# Generative AI - Ollama local en macOS
# -----------------------------------------------------------------------------
# Ollama debe estar corriendo en macOS con el modelo descargado:
#   ollama pull llava:13b
#
# Para usar un modelo diferente, cambiar "model" abajo.
# Modelos recomendados para vision: llava:13b, qwen3-vl:4b, llava:34b
genai:
  ollama_local:
    provider: ollama
    base_url: http://host.docker.internal:11434
    model: llava:13b
    roles:
      - vision
      - tools
    provider_options:
      keep_alive: -1
      options:
        num_ctx: 8192

# -----------------------------------------------------------------------------
# Cámaras
# -----------------------------------------------------------------------------
cameras:
  # Cámara de prueba con video local (para validar la instalación)
  test:
    enabled: true
    ffmpeg:
      inputs:
        - path: /media/frigate/car-stopping.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5
    objects:
      track:
        - person
        - car
        - dog
        - cat
      genai:
        enabled: true
    review:
      genai:
        enabled: true

  # -------------------------------------------------------------------------
  # Ejemplo de cámara IP real (descomentar y ajustar)
