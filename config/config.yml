# =============================================================================
# Frigate NVR - Configuración para Apple Silicon (M3 Max)
# =============================================================================
# Documentación: https://docs.frigate.video/configuration/
#
# Esta configuración está optimizada para:
#   - Detector Apple Silicon vía ZMQ (contenedor o nativo)
#   - Ollama corriendo localmente en macOS (puerto 11434)
#   - Hardware: Apple M3 Max, 128 GB RAM
#
# Versión de Frigate: 0.17.0 (stable-standard-arm64)
# =============================================================================

mqtt:
  enabled: true
  host: mqtt
  port: 1883

# -----------------------------------------------------------------------------
# Detector: Apple Silicon vía ZMQ
# -----------------------------------------------------------------------------
# Modo Docker (por defecto): el detector corre en el contenedor "frigate-detector"
#   endpoint: tcp://frigate-detector:5555
#
# Modo Nativo (máximo rendimiento): cambiar a:
#   endpoint: tcp://host.docker.internal:5555
#   y ejecutar ./scripts/start-detector-native.sh
detectors:
  apple_silicon:
    type: zmq
    endpoint: tcp://frigate-detector:5555

# -----------------------------------------------------------------------------
# Modelo de detección de objetos
# -----------------------------------------------------------------------------
# YOLOv9-t optimizado: ~8ms en Neural Engine (nativo), ~25-40ms en CPU (Docker)
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# -----------------------------------------------------------------------------
# FFmpeg: sin aceleración de hardware dentro del contenedor Linux
# -----------------------------------------------------------------------------
ffmpeg:
  hwaccel_args: []

# -----------------------------------------------------------------------------
# go2rtc: Restreaming de cámaras
# -----------------------------------------------------------------------------
# go2rtc soporta múltiples fuentes: RTSP, MJPEG, FFmpeg exec, etc.
# Documentación: https://github.com/AlexxIT/go2rtc
go2rtc:
  streams:
    # -------------------------------------------------------------------------
    # Cámara de prueba 1: Video local con personas, bicicletas y autos
    # Se reproduce en loop infinito usando ffmpeg dentro del contenedor.
    # Video: person-bicycle-car-detection.mp4 (768x432, H.264, 12fps)
    # -------------------------------------------------------------------------
    video_prueba:
      - "exec:/usr/lib/ffmpeg/ffmpeg -hide_banner -re -stream_loop -1 -i /config/test_video.mp4 -c copy -rtsp_transport tcp -f rtsp {{output}}"

    # -------------------------------------------------------------------------
    # Cámara de prueba 2: Webcam pública MJPEG (Japón)
    # Stream en vivo de una cámara pública. Puede no estar disponible 24/7.
    # -------------------------------------------------------------------------
    webcam_publica:
      - "http://honjin1.miemasu.net/nphMotionJpeg?Resolution=640x480&Quality=Standard"


    # -------------------------------------------------------------------------
    # Ejemplo de cámara IP real (descomentar y ajustar)
    # -------------------------------------------------------------------------
    # camara_principal:
    #   - rtsp://usuario:password@192.168.1.100:554/stream1
    # camara_principal_sub:
    #   - rtsp://usuario:password@192.168.1.100:554/stream2

# -----------------------------------------------------------------------------
# Generative AI - Ollama local en macOS
# -----------------------------------------------------------------------------
# Ollama debe estar corriendo en macOS con el modelo descargado:
#   ollama pull qwen3-vl:4b
#
# Modelos recomendados: qwen3-vl:4b, qwen2.5-vl, gemma3
genai:
  provider: ollama
  base_url: http://host.docker.internal:11434
  model: qwen3-vl:4b

# -----------------------------------------------------------------------------
# Cámaras
# -----------------------------------------------------------------------------
cameras:
  # -------------------------------------------------------------------------
  # Cámara de prueba 1: Video local en loop (personas, bicicletas, autos)
  # Ideal para probar la detección de objetos sin hardware real.
  # -------------------------------------------------------------------------
  video_prueba:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/video_prueba
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 768
      height: 432
      fps: 5
    objects:
      track:
        - person
        - bicycle
        - car
      genai:
        enabled: true
    review:
      genai:
        enabled: true
    record:
      enabled: true

  # -------------------------------------------------------------------------
  # Cámara de prueba 2: Webcam pública MJPEG
  # Stream en vivo. Puede tener latencia o no estar disponible 24/7.
  # -------------------------------------------------------------------------
  webcam_publica:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/webcam_publica
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
        - car


  # -------------------------------------------------------------------------
  # Ejemplo de cámara IP real (descomentar y ajustar)
  # -------------------------------------------------------------------------
  # camara_principal:
  #   enabled: true
  #   ffmpeg:
  #     inputs:
  #       - path: rtsp://127.0.0.1:8554/camara_principal
  #         input_args: preset-rtsp-restream
  #         roles:
  #           - record
  #       - path: rtsp://127.0.0.1:8554/camara_principal_sub
  #         input_args: preset-rtsp-restream
  #         roles:
  #           - detect
  #   detect:
  #     enabled: true
  #     width: 640
  #     height: 480
  #     fps: 5
  #   objects:
  #     track:
  #       - person
  #       - car
  #       - dog
  #       - cat
  #     genai:
  #       enabled: true
  #   review:
  #     genai:
  #       enabled: true
  #   record:
  #     enabled: true
  #     alerts:
  #       retain:
  #         days: 10
  #     detections:
  #       retain:
  #         days: 10

version: 0.17-0
